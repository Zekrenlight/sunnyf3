[package]
name = "mod-sunnyf3"
version = "1.0.1"
edition = "2024"
license = "MIT"
publish = false
description = "SunnyF3 for Sunrise: a cleaner, colour-coded debug screen in sections you can move, hide and restyle."
authors = ["Zekrenlight"]

[lib]
name = "mod_sunnyf3"
path = "src/lib.rs"

[dependencies]
# The pinned SDK's API crate, fetched into .sunrise/sdk/ by any `cargo sunrise-mod` command.
sunrise-mod-api = { path = ".sunrise/sdk/api/crates/sunrise-mod-api" }
